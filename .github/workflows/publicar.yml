# Publica la web en GitHub Pages cada vez que se sube un cambio a main (10-nov-2026).
# Versión de prueba en https://alhu1214.github.io/elnuba-web/ (con noindex mientras PUBLICADA = false).
# Cuando esté el dominio de ELNUBA: quitar SITE_URL y BASE_PATH de abajo y añadir public/CNAME con el dominio.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://alhu1214.github.io
          BASE_PATH: /elnuba-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
